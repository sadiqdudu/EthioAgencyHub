version: '3.8'

services:
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_DATABASE: ethio_agency_hub
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: agency_user
      MYSQL_PASSWORD: agency_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://agency_user:agency_password@db:3306/ethio_agency_hub
      - JWT_SECRET=this-is-a-very-long-and-secure-jwt-secret-key-12345
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      - db

volumes:
  mysql_data:
